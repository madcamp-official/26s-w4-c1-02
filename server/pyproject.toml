[project]
name = "instrument-server"
version = "0.1.0"
description = "세상을 악기로 만드는 카메라 — DSP 분석 + 처리 서버 + 잼 세션 (역할 A)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "scipy",
    "soundfile",
    "python-multipart",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
